apiVersion: v1
kind: ConfigMap
metadata:
  name: czertainly-nginx-configmap
data:
  nginx.conf: |
    worker_processes  6;

    error_log  /dev/stderr debug;
    pid        /tmp/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /dev/stdout main;

        sendfile        on;

        keepalive_timeout  65;

        include /etc/nginx/conf.d/*.conf;

        proxy_http_version                      1.1;
    }
  ingress.conf: |
    server {
        listen 8443 ssl http2;
        server_name _;

        ssl_certificate         /etc/nginx/ssl/ingress.crt;
        ssl_certificate_key     /etc/nginx/ssl/ingress.key;
        ssl_password_file       /etc/nginx/ssl/ingress.key.password;
        ssl_client_certificate  /etc/nginx/ssl/trustedCA.crt;
        ssl_verify_client       optional;

        location / {
            proxy_set_header X-Forwarded-Proto      $scheme;
            proxy_set_header X-Forwarded-Host       $host;
            proxy_set_header X-Forwarded-Port       443;
            proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
            proxy_set_header ssl-client-cert        $ssl_client_escaped_cert;
            proxy_set_header Host                   $host;

            proxy_redirect  off;
            proxy_pass      http://api-gateway-service:8000/;
        }
    }
